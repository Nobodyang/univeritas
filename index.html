  const isEN=(txt.match(/[a-zA-Z]/g)||[]).length > (txt.match(/[\u4e00-\u9fff]/g)||[]).length;
  const words=isEN?txt.split(/\s+/).filter(Boolean).length:0;
  const chars=isEN?0:(txt.match(/[\u4e00-\u9fff]/g)||[]).length;
  const paras=txt.split(/\n\s*\n|\n/).filter(p=>p.trim().length>10).length;
  const nums=(txt.match(/\d+(\.\d+)?%?/g)||[]).length;
  const proper=isEN?(txt.match(/\b[A-Z][a-zA-Z]{2,}\b/g)||[]).filter(w=>!['I','The','My','When','After','Before','This','That','It','In','On','At','For','But','And','So','As'].includes(w)).length:(txt.match(/[「『《》]/g)||[]).length*2+(txt.match(/大学|学院|实验室|公司|项目|比赛|竞赛/g)||[]).length;
  const reflect=(txt.match(/让我明白|教会我|意识到|领悟|反思|从此|改变了我|I learned|I realized|taught me|shaped|made me|growth|I understood/gi)||[]).length;
  const cliche=(txt.match(/从小|一直以来|我(就)?的梦想|贵校|众所周知|when i was (a )?(child|young)|since i was young|i have always|passion for (learning|knowledge)|broaden my horizon|ever since|as a (child|kid)|from a young age/gi)||[]);
  const fb=[]; let sc=0;
  // 篇幅
  if(isEN){ if(words>=380&&words<=700){sc+=25;fb.push(['✅',L('篇幅 '+words+' 词，在 PS 黄金区间（400-650）',words+' words — right in the PS sweet spot (400-650)')]);} else if(words<380){sc+=8;fb.push(['⚠️',L('篇幅 '+words+' 词偏短，招生官会觉得投入度不足（建议 400+）',words+' words is short — officers may read it as low effort (aim 400+)')]);} else {sc+=14;fb.push(['⚠️',L('篇幅 '+words+' 词偏长，重点会被稀释（建议压到 650 内）',words+' words is long — your point gets diluted (trim to ≤650)')]);} }
  else { if(chars>=500&&chars<=1100){sc+=25;fb.push(['✅',L('篇幅 '+chars+' 字，区间合适',chars+' chars — good length')]);} else if(chars<500){sc+=8;fb.push(['⚠️',L('篇幅 '+chars+' 字偏短（建议 600-1000 字）',chars+' chars — short (aim 600-1000)')]);} else {sc+=14;fb.push(['⚠️',L('篇幅 '+chars+' 字偏长，建议精简',chars+' chars — long, consider trimming')]);} }
  // 具体性
  if(nums+proper>=8){sc+=25;fb.push(['✅',L('具体性强：含 '+nums+' 处数字/数据、'+proper+' 处具体名词 —— 这是顶级文书的核心特征','Highly specific: '+nums+' numbers/data points, '+proper+' concrete nouns — the hallmark of top essays')]);}
  else if(nums+proper>=4){sc+=15;fb.push(['⚠️',L('具体性中等（数字 '+nums+'、专名 '+proper+'）—— 每段至少落一个可验证的细节','Moderately specific ('+nums+' numbers, '+proper+' proper nouns) — anchor one verifiable detail per paragraph')]);}
  else {sc+=4;fb.push(['❌',L('全文几乎没有数字和具体名词 —— "我做了很多科研"不如"我在 XX 实验室清洗了 3000 条语料"','Almost no numbers or concrete nouns — "I did lots of research" loses to "I cleaned 3,000 corpus entries in lab X"')]);}
  // 反思
  if(reflect>=3){sc+=25;fb.push(['✅',L('反思层充分（'+reflect+' 处成长/领悟表达）—— 文书有"所以然后呢"的回答','Strong reflection ('+reflect+' growth/realization markers) — the essay answers "so what?"')]);}
  else if(reflect>=1){sc+=13;fb.push(['⚠️',L('反思不足（仅 '+reflect+' 处）—— 每个故事后要写清它如何改变了你','Thin reflection (only '+reflect+') — after each story, spell out how it changed you')]);}
  else {sc+=3;fb.push(['❌',L('几乎没有反思句 —— 只叙事不升华是文书最常见硬伤','Barely any reflection — narrative without insight is the most common essay flaw')]);}
  // 结构
  if(paras>=3&&paras<=8){sc+=15;fb.push(['✅',L('段落结构清晰（'+paras+' 段）','Clear structure ('+paras+' paragraphs)')]);} else {sc+=6;fb.push(['⚠️',L('段落结构可优化（当前 '+paras+' 段，建议 4-6 段）','Structure could improve ('+paras+' paragraphs; aim 4-6)')]);}
  // 陈词
  if(cliche.length===0){sc+=10;fb.push(['✅',L('无陈词滥调（未检出"从小我就/贵校/ever since"类开头癌）','No clichés detected (no "since I was a child / your esteemed school / ever since" openers)')]);}
  else {sc+=Math.max(0,10-cliche.length*5);fb.push(['❌',L('检出 '+cliche.length+' 处陈词：'+cliche.slice(0,3).map(c=>'「'+c+'」').join('')+' —— 招生官一天看 200 遍这种句子',cliche.length+' clichés found: '+cliche.slice(0,3).map(c=>'"'+c+'"').join(', ')+' — officers read these 200 times a day')]);}
  const level=sc>=80?'great':sc>=60?'good':sc>=40?'avg':'weak';
  const lvMap={great:[L('出色','Outstanding'),'#047857'],good:[L('较好','Good'),'#1D4ED8'],avg:[L('普通','Average'),'#B45309'],weak:[L('较弱','Weak'),'#9f1239']};
  document.getElementById('m-essay').value=level;
  const lv=lvMap[level];
  out.innerHTML=`<div style="background:#fff;border:1px solid #EDE3CE;border-radius:12px;padding:13px 15px">
    <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
      <span style="font-family:'Noto Serif SC',serif;font-size:30px;font-weight:800;color:${lv[1]}">${sc}</span>
      <span style="font-size:13px;font-weight:800;color:${lv[1]}">${L('评级：','Rating: ')}${lv[0]}${L('（已自动回填到上方「申请文书（自评）」）',' (auto-filled into the self-rating above)')}</span>
    </div>
    <div style="margin-top:9px;display:flex;flex-direction:column;gap:5px">${fb.map(f=>`<div style="font-size:12.5px;line-height:1.65;color:#4d483f">${f[0]} ${f[1]}</div>`).join('')}</div>
    <div style="font-size:10.5px;color:#a89a78;margin-top:9px">${L('评分维度：篇幅25 + 具体性25 + 反思深度25 + 结构15 + 语言原创性10','Scoring: length 25 + specificity 25 + reflection 25 + structure 15 + originality 10')}</div>
  </div>`;
}
/* v15：13 项标化 chip 输入夹取区间 [min,max,step?]（TOEFL 为 2026 新制 1–6；GMAT 为 Focus 新制满分 805；AP/AL 无官方满分，给合理上限） */

/* 输入中立即压回上界（下界等失焦再压，避免打字过程被顶到 min）；full=true 时上下界全夹 + 步进对齐 */
function mChipClamp(el,full){
  const c=M_CLAMP[el.dataset.s]; if(!c||el.value==='') return;
  let v=parseFloat(el.value); if(isNaN(v)) return;
  const over=v>c[1], under=v<c[0];
  if(!over&&!(full&&under)) return;
  if(over) v=c[1]; else v=c[0];
  if(c[2]) v=Math.round(v/c[2])*c[2];
  v=Math.max(c[0],Math.min(c[1],v));
  el.value=parseFloat(v.toFixed(2));
}

function uniCases(name){ if(typeof CASES==='undefined'||!name) return []; return CASES.filter(c=>c.uni===name||c.uni.includes(name)||(name.length>4&&name.includes(c.uni))); }
function strengthParts(p){
  const parts={};
  // ① 学业 GPA：满分38。4.0→38；3.8→33.7；3.5→27.3；3.0→17.1；2.0→0
  let g4 = p.scale==='100' ? (p.gpa/100*4) : p.gpa;
  g4 = Math.max(0, Math.min(4, g4||0));
  parts.gpa = Math.pow(Math.max(0,(g4-2)/2),1.15)*38;
  // ② 高中/本科院校背景：满分8
  if(p.degree==='ug'){
    parts.school = ({top_intl:8,good_intl:5,overseas:7,key_cn:2,normal_cn:0})[p.hs]||0;
  } else {
    parts.school = ({c9:8,p985:5,ov:7,other:1})[p.ugtier]||0;
  }
  // ③ 标化：合计封顶14（SAT/ACT/GRE/GMAT/IB 满分档 ≈1580/36/340/800/45）
  let tb=0;
  (p.tests||[]).forEach(t=>{
    const v=t.score;
    if(t.t==='sat') tb+=Math.max(0,Math.min(12,(v-1100)/480*12));
    if(t.t==='act') tb+=Math.max(0,Math.min(12,(v-24)/12*12));
    if(t.t==='gre') tb+=Math.max(0,Math.min(12,(v-300)/40*12));
    if(t.t==='gmat') tb+=Math.max(0,Math.min(12,(v-520)/280*12));
    if(t.t==='ib') tb+=Math.max(0,Math.min(12,(v-32)/13*12));
    if(t.t==='alevel') tb+=Math.max(0,Math.min(9,v*3))+Math.min(1.5,((p.alCore||[]).filter(s=>['数学','进阶数学','物理','化学'].includes(s)).length)*0.5);
    if(t.t==='ossd'||t.t==='bc') tb+=Math.max(0,Math.min(12,(v-70)/30*12));
    if(t.t==='atar') tb+=Math.max(0,Math.min(12,(v-85)/14.95*12));
    if(t.t==='dse') tb+=Math.max(0,Math.min(12,(v-14)/21*12));
    if(t.t==='ap') tb+=Math.max(0,Math.min(8,v*2))+Math.min(2,((p.apCore||[]).filter(s=>['微积分BC','物理C','化学','生物','计算机A','统计'].includes(s)).length)*0.5);
    if(t.t==='toefl') tb+=Math.max(0,Math.min(3,(toeflBandTo120(Math.max(1,Math.min(6,v)))-90)/25*3)); /* v15：新制 band → 官方区间中点（旧制代表分）再评分 */
    if(t.t==='ielts') tb+=Math.max(0,Math.min(3,(v-5.5)/2.5*3));
  });
  parts.tests = Math.min(14, tb);
  // ④ 竞赛：按最高级别定档（满分12）+ 领域广度少量加成
  parts.comps = ({none:0,school:1.5,province:4,national:8,intl:12})[p.compLevel]||0;
  // ⑤ 科研 + 夏校：满分 10+8=18
  parts.research = ({none:0,school:2,lab:4.5,pub:7,top:10})[p.research]||0;
  parts.summer = ({none:0,normal:2,select:5,elite:8})[p.summer]||0;
  // ⑥ 文书 + 推荐信：满分 5+4=9
  parts.essay = ({weak:0,avg:1.5,good:3,great:5})[p.essay]||0;
  parts.rec = ({normal:0,strong:2,top:4})[p.rec]||0;
  // ⑦ 活动/领导力：满分6
  parts.act = ({none:0,school:1.5,province:3.5,intl:6})[p.act]||0;
  // 学位阶段修正：研究生申请另有科研权重已在上方计入，博士微调
  let adj=0; if(p.degree==='gr') adj+=2; if(p.degree==='phd') adj+=4;
  const raw = parts.gpa+parts.school+parts.tests+parts.comps+parts.research+parts.summer+parts.essay+parts.rec+parts.act+adj;
  parts.total = Math.max(1, Math.min(100, raw));
  return parts;
}
function matchStrength(p){ return strengthParts(p).total; }




/* 输入归一化：大小写/空格/标点剥离 + 阿拉伯数字转中文（11→十一、101→一零一…） */
function hsNorm(s){
  s=String(s||'').toLowerCase().replace(/[\s·・.\-—_()（）\[\]【】,，、'"'"]/g,'');
  const digits={'101':'一零一','24':'二十四','55':'五十五','11':'十一','12':'十二','14':'十四','10':'十','1':'一','2':'二','3':'三','4':'四','5':'五','6':'六','7':'七','8':'八','9':'九','0':'零'};
  return s.replace(/101|24|55|11|12|14|10|[0-9]/g,m=>digits[m]||m);
}
/* 在梯队表中查找匹配的学校名（返回匹配到的词条） */
function hsLookup(n){
  const nn=hsNorm(n); if(!nn) return null;

/* ===== v11.11 Word/PPT 拖入解析（零依赖：DecompressionStream + 极简ZIP读取，纯本地） ===== */
async function _zipRead(buf){
  const u8=new Uint8Array(buf), dv=new DataView(buf);
  let eocd=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-65558);i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error('not-zip');
  const n=dv.getUint16(eocd+10,true);
  let p=dv.getUint32(eocd+16,true);
  const ents={};
  const dec=new TextDecoder();
  for(let k=0;k<n;k++){
    if(p+46>u8.length||dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true);
    const nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nl));
    const lnl=dv.getUint16(lho+26,true), lel=dv.getUint16(lho+28,true);
    const ds=lho+30+lnl+lel;
    ents[name]={method,raw:u8.subarray(ds,ds+csize)};
    p+=46+nl+el+cl;
  }
  async function inflate(e){
    if(e.method===0) return e.raw;
    const stream=new Blob([e.raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  return {
    list:()=>Object.keys(ents),
    text:async name=>{ const e=ents[name]; if(!e) return null; return new TextDecoder('utf-8').decode(await inflate(e)); }
  };
}
function _xmlToText(s){
  s=String(s||'');
  s=s.replace(/<w:br\s*\/>/g,'\n').replace(/<a:br\s*\/>/g,'\n');
  s=s.replace(/<w:tab\s*\/>/g,'\t').replace(/<a:tab\s*\/>/g,'\t');
  s=s.replace(/<\/w:p>/g,'\n').replace(/<\/a:p>/g,'\n').replace(/<\/w:tr>/g,'\n').replace(/<\/w:tc>/g,' ');
  s=s.replace(/<[^>]+>/g,'');
  return s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,(m,c)=>String.fromCharCode(+c)).replace(/&amp;/g,'&');
}
async function handleMatchFile(f){
  const out=document.getElementById('m-parse-out');
  const setErr=t=>{ out.textContent=t; out.style.color='#C0392B'; };
  const name=(f.name||'').toLowerCase();
  if(f.size>30*1024*1024){ setErr(L('文件过大（>30MB）——请直接粘贴文字','File too large (>30MB) — paste text instead')); return; }
  if(/\.(txt|md|csv|json)$/.test(name)){
    const reader=new FileReader();
    reader.onload=e=>{ document.getElementById('m-paste').value=String(e.target.result||'').slice(0,8000); parseMatchText(); };
    reader.readAsText(f); return;
  }
  if(/\.(doc|ppt)$/.test(name)){ setErr(L('旧版 .doc / .ppt 暂不支持——请在 Office / WPS 中「另存为」.docx / .pptx 后再拖入','Legacy .doc/.ppt not supported — “Save As” .docx/.pptx in Office/WPS first')); return; }
  if(!/\.(docx|pptx)$/.test(name)){ setErr(L('仅支持 .docx / .pptx / .txt / .md 文件，或直接粘贴文字','Only .docx / .pptx / .txt / .md, or paste text')); return; }
  if(typeof DecompressionStream==='undefined'){ setErr(L('当前浏览器版本过旧，无法解析 Office 文件——请直接粘贴文字','Browser too old to parse Office files — paste text instead')); return; }
  out.textContent=L('正在解析'+(name.endsWith('.docx')?' Word ':' PPT ')+'文件…','Parsing '+(name.endsWith('.docx')?'Word':'PPT')+' file…'); out.style.color='#8A8C90';
  try{
    const zip=await _zipRead(await f.arrayBuffer());
    let text='';
    if(name.endsWith('.docx')){
      const doc=await zip.text('word/document.xml');
      if(doc==null) throw new Error('no-doc');
      text=_xmlToText(doc);
    }else{
      const slides=zip.list().filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n))
        .sort((a,b)=>(+a.match(/slide(\d+)/)[1])-(+b.match(/slide(\d+)/)[1])).slice(0,80);
      if(!slides.length) throw new Error('no-slides');
      for(const s of slides){ text+=_xmlToText(await zip.text(s))+'\n\n'; }
    }
    text=text.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').replace(/^\s+|\s+$/g,'');
    if(text.length<5) throw new Error('empty');
    document.getElementById('m-paste').value=text.slice(0,8000);
    parseMatchText();
    if(out.style.color==='rgb(45, 122, 78)'||out.textContent.indexOf('✓')===0){
      out.textContent=L('已从「'+f.name+'」提取 '+Math.min(text.length,8000)+' 字 · ','Extracted '+Math.min(text.length,8000)+' chars from '+f.name+' · ')+out.textContent;
    }
  }catch(err){
    setErr(L('无法解析该文件（可能已加密或已损坏）——请在 Office / WPS 中「另存为」新文件后再试，或直接粘贴文字','Cannot parse (encrypted or corrupted?) — “Save As” a new file in Office/WPS, or paste text'));
  }
}

function parseMatchText(){

  const found=[];

  m=txt.match(/OSSD\s*[:：]?\s*(\d{2,3})(?:\.\d)?/i); if(m&&+m[1]>=60&&+m[1]<=100) setTest('ossd',m[1],'OSSD '+m[1]);
  m=txt.match(/(?:BC|不列颠哥伦比亚|卑诗)\s*(?:省)?\s*(?:课程|均分)?\s*[:：]?\s*(\d{2,3})(?:\.\d)?/i); if(m&&+m[1]>=60&&+m[1]<=100) setTest('bc',m[1],'BC '+m[1]);
  m=txt.match(/ATAR\s*[:：]?\s*(\d{2}(?:\.\d{1,2})?)/i); if(m&&+m[1]>=50&&+m[1]<=99.95) setTest('atar',m[1],'ATAR '+m[1]);
  m=txt.match(/DSE\s*[:：]?\s*(?:最佳?\s*5\s*科)?\s*(\d{2})(?![\.\d])/i); if(m&&+m[1]>=10&&+m[1]<=35) setTest('dse',m[1],'DSE '+m[1]);
  m=txt.match(/GRE\s*[:：]?\s*(\d{3})/i); if(m&&+m[1]>=260&&+m[1]<=340) setTest('gre',m[1],'GRE '+m[1]);
  m=txt.match(/GMAT\s*[:：]?\s*(\d{3})/i); if(m&&+m[1]>=205&&+m[1]<=805) setTest('gmat',m[1],'GMAT '+m[1]);
  /* v15：托福双轨——先按旧制 40–120（2-3 位整数）匹配；否则按 2026 新制 1–6（含 0.5 步进，一位小数且 ≤6） */
  m=txt.match(/托福\s*[:：]?\s*(\d{2,3})/i)||txt.match(/TOEFL\s*[:：]?\s*(\d{2,3})/i);

  m=txt.match(/雅思\s*[:：]?\s*(\d(?:\.\d)?)/i)||txt.match(/IELTS\s*[:：]?\s*(\d(?:\.\d)?)/i); if(m&&+m[1]>=4&&+m[1]<=9) setTest('ielts',m[1],'IELTS '+m[1]);
  // 高中
  { const _hh=hsLookup(txt); if(_hh){ g('m-hsname').value=_hh.hit; hsAuto(); found.push(L('高中 ','HS ')+_hh.hit); } }
  // 学位阶段
  if(/博士|PhD|phd/i.test(txt)){ g('m-degree').value='phd'; found.push(L('博士申请','PhD')); }

  // 专业方向
  for(const mj of MATCH_MAJORS){ if(mj.kw.some(k=>txt.includes(k))){ g('m-major').value=mj.k; found.push(L('专业方向 ','Major ')+(LANG==='en'?(mj.en||mj.n):mj.n)); break; } }
  // 竞赛
  const compMap=[['math',['AMC','AIME','数学奥赛','数竞','IMO']],['phys',['BPhO','物理碗','Physics Bowl','物理奥赛','IPhO']],['chem',['UKChO','BBO','化学奥赛','生物奥赛','IBO']],['info',['USACO','NOI','信息学','IOI','Kaggle']],['research',['ISEF','论文','科研','丘成桐']],['biz',['DECA','FBLA','NEC','商赛']],['hum',['John Locke','MUN','模联','辩论']]];

    else if(/省一|省二|省级|AIME/.test(txt)){ cl.value='province'; found.push(L('省级竞赛奖项','Provincial awards')); } }
  // 科研
  const rs=g('m-research');
  if(rs){ if(/顶会|顶刊|SCI一作|第一作者.*(发表|论文)|NeurIPS|ICML|CVPR|Nature|Science子刊/.test(txt)){ rs.value='top'; found.push(L('顶会/顶刊科研','Top-venue research')); }
    else if(/论文(发表|收录)|发表.*论文|conference|journal|SCI|EI检索/.test(txt)){ rs.value='pub'; found.push(L('论文发表','Publication')); }
    else if(/实验室|课题组|导师制|Pioneer|科研实习|暑研/.test(txt)){ rs.value='lab'; found.push(L('校外科研经历','External research')); }
    else if(/校内(科研|课题)|研究性学习/.test(txt)){ rs.value='school'; found.push(L('校内科研项目','School research')); } }
  // 夏校
  const sm=g('m-summer');
  if(sm){ if(/RSI|SSP|TASP|Clark Scholar|SSTP|MITES|Simons/.test(txt)){ sm.value='elite'; found.push(L('顶级夏校','Elite summer program')); }
    else if(/YYGS|Pioneer|ROSS|SUMaC|PROMYS|AwesomeMath|宾大|斯坦福夏校|选拔性夏校/.test(txt)){ sm.value='select'; found.push(L('选拔性夏校','Selective summer program')); }
    else if(/夏校|summer school|暑校/.test(txt)){ sm.value='normal'; found.push(L('夏校经历','Summer program')); } }
  // 文书（关键词弱提示）
  const es=g('m-essay'); if(es&&/文书|essay|personal statement|PS/i.test(txt)){ found.push(L('文书信息(请自评档位)','Essay (self-rate above)')); }
  // 活动 / 领导力
  if(/国际级|国际奖项|国际比赛|创业|公益项目|志愿项目/.test(txt)){ g('m-act').value='intl'; found.push(L('国际级活动','Intl activities')); }
  else if(/省市级|省级|市级(获奖|比赛|活动)/.test(txt)){ g('m-act').value='province'; found.push(L('省市级活动','Provincial activities')); }
  else if(/学生会|社团(负责人|主席|部长|社长)|班长|队长|模联主席/.test(txt)){ g('m-act').value='school'; found.push(L('校级活动','School activities')); }
  out.style.color='#2D7A4E';
  out.textContent=found.length?(L('✓ 已识别并填写：','✓ Detected & filled: ')+found.join(' · ')):L('未识别到可填信息，请补充如 "GPA 3.8 SAT 1500" 等关键词','Nothing detected — try keywords like "GPA 3.8 SAT 1500"');

function hsAuto(){
  const n=(document.getElementById('m-hsname').value||'').trim();
  const note=document.getElementById('m-hsnote');
  if(!n){ if(note) note.textContent=''; return; }
  const hit=hsLookup(n);
  const sel=document.getElementById('m-hs');
  if(hit){
    sel.value=hit.tier;
    if(note){
      if(hit.tier==='top_intl'){ note.style.color='#8C1515'; note.textContent=L('✓ 已识别「'+hit.hit+'」：平台收录的第一梯队国际课程校（全库仅约20所），GPA认可度最高档','✓ Recognized "'+hit.hit+'": tier-1 intl-curriculum school (~20 in DB) — highest GPA credibility'); }
      else { note.style.color='#9a7d1a'; note.textContent=L('✓ 已识别「'+hit.hit+'」：平台收录的知名国际学校/国际部（第二梯队），归为「知名高中国际部」档','✓ Recognized "'+hit.hit+'": known intl school/division (tier 2)'); }
    }
    return;
  }
  if(note){ note.style.color='var(--text-muted)'; note.textContent=''; }
  if(/美高|美国高中|英高|英国高中|加高|加拿大高中|澳高|美国|加拿大|英国.*高中|海外高中/i.test(n)){
    sel.value='overseas';
    if(note){ note.style.color='var(--text-muted)'; note.textContent=L('已按海外高中档计入','Counted as overseas high school'); }
  } else if(/国际|外国语|双语|附中|实验|书院/.test(n)){
    if(sel.value==='key_cn'||sel.value==='normal_cn') sel.value='good_intl';
    if(note){ note.style.color='var(--text-muted)'; note.textContent=L('未在平台高中库中精确命中，已按名称特征归入「知名高中国际部」档，可手动调整','Not an exact DB hit — classed as known intl division by name; adjust manually if needed'); }
  } else if(note){
    note.textContent=L('未识别的高中：默认按当前所选档位计入，如学校开设国际课程请手动选择对应档位','Unrecognized school — using the tier selected above; adjust if it offers an intl curriculum');
  }
}

function runMatch(){
  try{ uvTrack('feature','match'); }catch(e){} /* v16 埋点：AI 选校运行 */
  const g=id=>document.getElementById(id);
  const regions=[...document.querySelectorAll('#m-regions input:checked')].map(x=>x.value);
  /* v15：读取时再夹一次（防御绕过 oninput 的注入值） */
  const tests=[...document.querySelectorAll('#m-tests input[type=checkbox]:checked')].map(cb=>{
    const c=M_CLAMP[cb.dataset.t];
    let v=parseFloat(document.querySelector(`#m-tests input[data-s=${cb.dataset.t}]`).value)||0;
    if(c) v=Math.max(c[0],Math.min(c[1],v));
    return {t:cb.dataset.t, score:v};
  });
  const comps=document.querySelectorAll('#m-comps input[type=checkbox]:checked').length;
  const p={ degree:g('m-degree').value, gpa:parseFloat(g('m-gpa').value)||3.3, scale:g('m-gpascale').value,
    hs:g('m-hs').value, hsName:g('m-hsname').value.trim(), tests, comps, act:g('m-act').value,
    compLevel:(g('m-complevel')||{}).value||'none', research:(g('m-research')||{}).value||'none', summer:(g('m-summer')||{}).value||'none',
    apCore:[...document.querySelectorAll('#m-ap-subs input:checked')].map(x=>x.dataset.apsub),
    alCore:[...document.querySelectorAll('#m-al-subs input:checked')].map(x=>x.dataset.alsub),
    essay:(g('m-essay')||{}).value||'avg', rec:(g('m-rec')||{}).value||'normal', ugtier:(g('m-ugtier')||{}).value||'p985',
    major:g('m-major').value, budget:parseFloat(g('m-budget').value), city:g('m-city').value, career:g('m-career').value, regions };
  const strength=matchStrength(p);
  const majorKw=(MATCH_MAJORS.find(m=>m.k===p.major)||MATCH_MAJORS[0]).kw;
  const list=getVisibleUnis().filter(u=>p.regions.includes(u.region));
  const scored=list.map(u=>{
    const m=getModules(u); const diff=m.admission.difficulty;
    const ddiff=strength-diff*10;
    const base=100-Math.abs(ddiff)*2.2; let bonus=0;
    const cost=(REGION_COST_WAN[u.region]||20)*(u.region==='sg'&&['sim','psb','kaplan','curtinsg','jcu'].includes(u.id)?0.55:1)*(u.region==='us'&&['rutgers','ohiostate','purdue','umn','uconn','iu','umass','vt','tamu','uf','ucdavis'].includes(u.id)?0.75:1);
    let reasons=[];
    if(p.budget>=100||cost<=p.budget){ bonus+=12; reasons.push(L('预算内 ¥'+Math.round(cost)+'万/年','¥'+Math.round(cost)+'k/yr within budget')); }
    else if(cost<=p.budget*1.15){ bonus+=2; reasons.push(L('预算略超','Slightly over budget')); }
    else { bonus-=25; }
    const hl=(u.hl||[]).join(' ');
    if(majorKw.some(k=>hl.includes(k))||majorKw.some(k=>u.name.includes(k))){ bonus+=20; reasons.push(L('专业强势','Strong in your major')); }
    const big=BIG_CITIES.some(c=>u.city.includes(c));
    if(p.city==='big'&&big){ bonus+=10; reasons.push(L('大城市','Big city')); }
    if(p.city==='town'&&!big){ bonus+=10; reasons.push(L('大学城','College town')); }
    if(p.career==='china'){ const cr=(m.chinaRec&&m.chinaRec.score)||3; bonus+=(cr-3)*6; if(cr>=4) reasons.push(L('回国认可度高','Well-recognized in China')); }
    if(p.career==='local'){ const se=m.localCareer?m.localCareer.stayEasy||3:3; bonus+=(se-3)*7; if(se>=4) reasons.push(L('易留当地','Easy to stay')); }
    reasons.unshift(L('难度 '+diff+'/10','Selectivity '+diff+'/10'));
    const score=Math.max(5,Math.min(99,base*0.8+bonus*0.5)); return {u, diff, ddiff, score, reasons};
  });
  const bands={reach:[],match:[],safe:[]};
  scored.forEach(s=>{
    if(s.ddiff>=-26&&s.ddiff<-7.5) bands.reach.push(s);
    else if(s.ddiff>=-7.5&&s.ddiff<12.5) bands.match.push(s);
    else if(s.ddiff>=12.5) bands.safe.push(s);
  });
  Object.values(bands).forEach(b=>b.sort((a,b)=>b.score-a.score));
  bands.reach=bands.reach.slice(0,6); bands.match=bands.match.slice(0,6); bands.safe=bands.safe.slice(0,6);
  matchResult={profile:p, bands};
  paintMatch(p, bands);
  document.getElementById('matchResults').scrollIntoView({behavior:'smooth',block:'start'});
}

let rvKw='';
function rvCN(r){ const s=(r.source||'')+(r.author||''); return /知乎|一亩三分地|小红书|豆瓣|微博|贴吧|B站|搜狐|网易|微信|公众号|ChaseDream|寄托|太傻|天涯|博客|人人/.test(s); }
function rvMatch(r){
  if(rvKw){ const hay=((r.major||'')+(r.title||'')+(r.text||'')).toLowerCase(); if(!hay.includes(rvKw.toLowerCase())) return false; }

}

}

/* ===================== SVG 图表 ===================== */
function renderSpark(arr){
  const w=140,h=40,p=4;
  const min=Math.min(...arr),max=Math.max(...arr);
  const range=max-min||1;
  const pts=arr.map((v,i)=>[p+i*(w-2*p)/(arr.length-1),h-p-(v-min)/range*(h-2*p)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1],first=pts[0];
  const up=last[1]<first[1]; // lower rank number = higher = up in chart
  const color=up?'#2D7A4E':'#9B2226';
  return `<svg class="rank-spark" viewBox="0 0 ${w} ${h}"><path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="${color}"/></svg>`;
}
function renderGauge(val,max){
  const pct=val/max;
  const angle=-90+pct*180;
  const r=80,cx=100,cy=100;
  const circ=Math.PI*r;
  const dash=pct*circ;
  return `<svg class="gauge" viewBox="0 0 200 120"><path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#E5E0DA" stroke-width="14" stroke-linecap="round"/><path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="var(--c-primary)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${dash} ${circ}"/><g transform="translate(100 100) rotate(${angle})"><line x1="0" y1="0" x2="0" y2="-68" stroke="var(--text)" stroke-width="3" stroke-linecap="round"/><circle cx="0" cy="0" r="5" fill="var(--text)"/></g><text x="100" y="92" text-anchor="middle" class="val" style="font-family:'SF Mono',monospace;font-size:30px;font-weight:700;fill:var(--c-primary)">${val}</text></svg>`;
}
function renderRadar(fields,color){
  const labels=Object.keys(fields),vals=Object.values(fields);
  const cx=120,cy=120,r=90,n=labels.length;
  const pts=vals.map((v,i)=>{const ang=-Math.PI/2+i*2*Math.PI/n;const rr=r*v/5;return [cx+Math.cos(ang)*rr,cy+Math.sin(ang)*rr];});
  const poly=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const axes=labels.map((l,i)=>{const ang=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(ang)*r,cy+Math.sin(ang)*r];});
  const labelPos=labels.map((l,i)=>{const ang=-Math.PI/2+i*2*Math.PI/n;const rr=r+18;return [cx+Math.cos(ang)*rr,cy+Math.sin(ang)*rr,l];});
  return `<svg viewBox="0 0 240 240" style="width:100%;max-width:320px;margin:0 auto;display:block">
    ${axes.map(a=>`<line x1="${cx}" y1="${cy}" x2="${a[0].toFixed(1)}" y2="${a[1].toFixed(1)}" stroke="#E5E0DA" stroke-width="1"/>`).join('')}
    ${[1,2,3,4].map(k=>{const rr=r*k/5;const p=[];for(let i=0;i<n;i++){const ang=-Math.PI/2+i*2*Math.PI/n;p.push((cx+Math.cos(ang)*rr).toFixed(1)+','+(cy+Math.sin(ang)*rr).toFixed(1));}return `<polygon points="${p.join(' ')}" fill="none" stroke="#E5E0DA" stroke-width="1"/>`;}).join('')}
    <polygon points="${poly}" fill="${color}" fill-opacity="0.2" stroke="${color}" stroke-width="2"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${color}"/>`).join('')}
    ${labelPos.map(lp=>`<text x="${lp[0].toFixed(1)}" y="${lp[1].toFixed(1)}" text-anchor="middle" dominant-baseline="middle" style="font-size:11px;fill:var(--text-soft);font-weight:600">${lp[2]}</text>`).join('')}
  </svg>`;
}

function auditText(s){
  s=String(s||'');
  const low=s.toLowerCase();
  const reasons=[];
  const ad=AUDIT_AD.filter(w=>low.includes(w.toLowerCase()));
  if(ad.length) reasons.push(L('疑似广告 / 中介推广（命中：','Suspected ads / agency promotion (hit: ')+[...new Set(ad)].join('、')+'）');
  const ab=AUDIT_ABUSE.filter(w=>low.includes(w.toLowerCase()));
  if(ab.length) reasons.push(L('包含辱骂 / 不当用语（命中：','Abusive language (hit: ')+[...new Set(ab)].join('、')+'）');
  if(/微信\s*[:：]?\s*[a-zA-Z][\w-]{4,}/.test(s)||/\bv(x|信)\s*[:：]?\s*[a-zA-Z][\w-]{4,}/i.test(s)) reasons.push(L('包含微信号等站外联系方式','Contains WeChat / off-platform contact info'));
  if(/\bq{1,2}\s*[:：]?\s*\d{5,11}\b/i.test(s)) reasons.push(L('包含 QQ 号等站外联系方式','Contains QQ / off-platform contact info'));
  if(/(?<!\d)1[3-9]\d{9}(?!\d)/.test(s)) reasons.push(L('包含手机号码','Contains a phone number'));
  if(/(https?:\/\/|www\.)\S+/i.test(s)) reasons.push(L('包含站外链接','Contains external links'));
  return {pass:!reasons.length, reasons};
}

    setTimeout(()=>{const el=document.getElementById('post-'+id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});},60);
  },1200);
}
function addComment(pid){
  const me=currentUser();
  if(!me){ navigate('auth'); return; }
  const el=document.getElementById('cmt-'+pid); if(!el) return;
  const txt=el.value.trim();
  const err=document.getElementById('cmt-err-'+pid);
  if(txt.length<2) { if(err) err.textContent=L('评论至少 2 个字','Comment too short'); return; }
  const res=auditText(txt);
  if(!res.pass){ if(err) err.textContent=L('评论未通过敏感词审核：','Comment blocked: ')+res.reasons.join('；'); return; }
  if(window.__apiOn){ /* C7 服务器模式评论 */
    uvApi('/api/posts/'+encodeURIComponent(pid)+'/comments',{method:'POST',body:{body:txt}}).then(r=>{
      uvLog(L('评论了帖子','Commented on a post'));
      toast(L('💬 评论已发布','💬 Comment posted'));
      if(r&&r.growth){ growthToast(r.growth,XP_RULES.comment); refreshMe(); } /* v16：评论 +8 XP（响应 growth 字段） */
      forumPostsSrv=null; forumRefresh(false);
    }).catch(e=>{
      if(err) err.textContent=(e.status===422&&e.reasons)?L('评论未通过服务端审核：','Blocked by server: ')+e.reasons.join('；'):(e.message||L('网络错误，请稍后再试','Network error'));
    });
    return;
  }
  const posts=getPosts(); const p=posts.find(x=>x.id===pid); if(!p) return;
  p.comments.push({nick:me.nick, body:txt, ts:Date.now()});
  savePosts(posts);
  uvLog(L('评论了帖子「'+p.title.slice(0,20)+'」','Commented on "'+p.title.slice(0,20)+'"'));
  toast(L('💬 评论已发布','💬 Comment posted'));
  try{ offlineGain('comment',XP_RULES.comment); }catch(e){} /* v16 离线：评论 +8 XP + 徽章检测 */
  renderForum();
}
function reportPost(pid){
  if(window.__apiOn){ /* C7 服务器模式举报：≥3 次服务端自动隐藏 */
    uvApi('/api/posts/'+encodeURIComponent(pid)+'/report',{method:'POST'}).then(r=>{
      uvLog(L('举报了帖子','Reported a post'));
      toast(r.hidden?L('已收到举报；该帖举报 ≥3 次，已自动隐藏待审','Report received; post auto-hidden pending review (≥3 reports)'):L('已收到举报，感谢监督（','Report received, thanks (' )+r.reports+'/3）');
      if(r.hidden){ forumPostsSrv=null; forumRefresh(false); } else paintForumList();
    }).catch(e=>{ toast(e.message||L('网络错误，请稍后再试','Network error')); });
    return;
  }
  const posts=getPosts(); const p=posts.find(x=>x.id===pid); if(!p) return;
  p.reports=(p.reports||0)+1;
  if(p.reports>=3){ p.audit='hold'; }
  savePosts(posts);
  uvLog(L('举报了帖子「'+p.title.slice(0,20)+'」','Reported "'+p.title.slice(0,20)+'"'));
  toast(p.audit==='hold'?L('已收到举报；该帖举报 ≥3 次，已自动隐藏待审','Report received; post auto-hidden pending review (≥3 reports)'):L('已收到举报，感谢监督（','Report received, thanks (' )+p.reports+'/3）');
  renderForum();
}
function delPost(pid){
  const me=currentUser(); if(!me) return;
  let posts=getPosts(); const p=posts.find(x=>x.id===pid);
  if(!p||p.phone!==me.phone){ toast(L('只能删除自己的帖子','You can only delete your own posts')); return; }
  posts=posts.filter(x=>x.id!==pid); savePosts(posts);
  uvLog(L('删除了帖子「'+p.title.slice(0,20)+'」','Deleted post "'+p.title.slice(0,20)+'"'));
  toast(L('帖子已删除','Post deleted'));

}

  if(/微信|weixin/i.test(pf)) return 'pf-wechat';

/* 启动（C7：先探测后端；在线则校验本地 token，失败降级为纯静态离线演示模式） */
/* v16 性能拆分：数据经 defer 外部脚本加载，启动延后至 DOMContentLoaded（defer 先于 DCL 执行完毕）；file:// 与 http 均适用 */
window.__uvDataGuard=function(){
  var need=["LOGOS","UNIS","CASES","FORUM_SEED","FORUM_SEED_CN","SCHOOL_ESSAYS","ADMIT_STATS","ROUNDS","STATE_INFO","US_COORDS","REVIEWS_EXTRA","HERO_IMGS","HS_DETAIL","PROFILE_REAL_EN","PROFILE_REAL","DESC_EN"];
  var miss=[];
  for(var gi=0;gi<need.length;gi++){ if(typeof window[need[gi]]==="undefined") miss.push(need[gi]); }
  if(miss.length){
    try{ console.warn("[UniVeritas] 数据文件未加载: "+miss.join(", ")+" — 请确认 assets/ 目录与 index.html 同级"); }catch(e){}
    var ap=document.getElementById("app");
    if(ap) ap.innerHTML='<div style="padding:60px 20px;text-align:center;max-width:560px;margin:0 auto"><h2 style="color:#8C1515;font-family:Georgia,serif">数据文件加载失败</h2><p style="color:#4D4F53;margin-top:14px;line-height:1.8;font-size:14px">缺少全局数据：'+miss.join(", ")+'<br>请确认 <b>assets/</b> 目录（data-*.js）与 index.html 位于同一级后刷新页面。</p></div>';
    return false;
  }
  return true;
};
window.__uvBoot=function(){
(async()=>{
try {
  seedPosts();
  await detectApi();
  if(window.__apiOn&&getToken()){ await refreshMe(); } /* v16：拉取契约全字段 me（xp/等级/徽章/未读/isAdmin），401 自动清理 */
  paintNavAuth(); const _rt=parseHash(); route=_rt.r; params=_rt.p; render(); document.querySelectorAll('.tabbar .tb').forEach(t=>t.classList.toggle('on',t.dataset.r===route));
  try{ offlineDeadlineScan(); }catch(e){} /* v16 离线：收藏校截止日 ≤14 天提醒（启动一次，24h 去重） */
  try{ startMePolling(); }catch(e){} /* v16 在线：每 60s 轮询 me.unread */
  try{ uvPV(); }catch(e){}
}
catch(e) {
  document.getElementById('app').innerHTML = '<div style="padding:40px"><h2 style="color:red">渲染错误</h2><pre style="color:red;font-size:14px">'+e.message+'\n'+e.stack+'</pre></div>';
}
})();
};
if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded",function(){ if(window.__uvDataGuard()) window.__uvBoot(); }); }
else { if(window.__uvDataGuard()) window.__uvBoot(); }
